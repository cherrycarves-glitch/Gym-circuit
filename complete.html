<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Complete - Gym Circuit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .total-time {
            color: #666;
            font-size: 3em;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Finished</h1>
        <div class="total-time" id="totalTime">0:00:00</div>
    </div>

    <script>
        // Calculate and display total workout time
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Get workout start time from localStorage
        const startTime = localStorage.getItem('workoutStartTime');
        
        if (startTime) {
            const startTimestamp = parseInt(startTime);
            const endTimestamp = Date.now();
            const totalSeconds = Math.floor((endTimestamp - startTimestamp) / 1000);
            
            // Display total time
            document.getElementById('totalTime').textContent = formatTime(totalSeconds);
            
            // Clear the start time from localStorage
            localStorage.removeItem('workoutStartTime');
        } else {
            // If no start time found, show 0:00:00
            document.getElementById('totalTime').textContent = '0:00:00';
        }
    </script>
</body>
</html>
